version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: aurex_postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: aurex
      POSTGRES_PASSWORD: aurex_secret_password
      POSTGRES_DB: aurex_db
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: aurex_redis
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes

volumes:
  pgdata: